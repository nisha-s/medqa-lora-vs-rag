# Tiny run that finishes on a laptop CPU. Inherits everything else from base.yaml.

extends: base.yaml

data:
  train_size: 50
  val_size: 20
  test_size: 20

lora:
  epochs: 1
  max_steps: 1
  batch_size: 2

retrieval:
  k: 3
  k_ablation: [1, 3]

mmlu:
  questions_per_subject: 2

wandb:
  enabled: false
