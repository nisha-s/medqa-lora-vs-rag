[project]
name = "medqa"
version = "0.1.0"
description = "RAG vs LoRA for symptom-to-disease prediction with small LLMs"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
